; Gamma Meter: ClimateGuard RadSens on a Wemos D1 (ESP8266).
; Build:   pio run
; Flash:   pio run -t upload --upload-port /dev/cu.usbserial-XXX
; Monitor: pio device monitor -b 115200

[env:d1]
platform = espressif8266
board = d1
framework = arduino

; 4 MB flash: ~1 MB sketch, 1 MB LittleFS (settings + history), rest unused.
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -Wall

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3.0

; gzips web/*.html into the build dir and sets APP_VER from git.
extra_scripts = pre:tools/prebuild.py
